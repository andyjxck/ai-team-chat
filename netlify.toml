[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--version"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["!node_modules/**/*"]
  node_bundler = "esbuild"

# Scheduled functions — defined in the function files using @netlify/functions
# - proactive-check: agent outreach 3x/day (9am, 1pm, 5pm)
# - autonomous-work: coding team self-improvement every 1 min (only when idle)
